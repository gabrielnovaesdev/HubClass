<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Hubclass</title>
  <meta name="description" content="O endereço acessado não existe no site da Hubclass." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#04081A" />
  <link rel="icon" href="/media/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
  <script>
    document.documentElement.classList.add('js');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="page-404">
  <!-- @partial header -->

  <main id="conteudo">
    <section class="closing" aria-labelledby="page-title">
      <div class="container closing__inner">
        <p class="kicker kicker--center">Erro 404</p>
        <h1 class="closing__title" id="page-title">Esta página não existe.</h1>
        <p class="closing__lead">O endereço pode ter mudado ou sido digitado errado. Escolha um dos caminhos abaixo.</p>
        <div class="actions">
          <a class="btn btn--primary btn--lg" href="/"><span data-roll>Ir para a página inicial</span></a>
          <a class="btn btn--ghost btn--lg" href="/formacao-varejo/"><span data-roll>Formação Varejo</span></a>
          <a class="btn btn--ghost btn--lg" href="/assessoria-m7/"><span data-roll>Assessoria M7</span></a>
        </div>
      </div>
    </section>
  </main>

  <!-- @partial footer -->
</body>
</html>
